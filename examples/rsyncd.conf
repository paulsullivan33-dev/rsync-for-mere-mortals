# rsyncd.conf — the daemon configuration verified in the
# "rsync Over the Network" chapter of rsync for Mere Mortals.
#
# Run standalone with:  rsync --daemon --config=rsyncd.conf
# List its modules with: rsync rsync://127.0.0.1:8873/
#
# Notes earned while verifying it:
# - The daemon serves a module as user "nobody" unless the
#   module sets uid/gid. That user must be able to traverse
#   every directory above the served tree and read the files;
#   if it can't, clients see "Permission denied" and exit
#   code 23 even though the module lists fine. In this lab
#   the directories above the tree blocked traversal by the
#   user nobody, so the module below names root explicitly.
#   On a normal system,
#   keep an unprivileged uid and make the paths traversable.
# - The daemon protocol does not encrypt. On anything but a
#   trusted network, use rsync over ssh instead.

pid file = /home/user/rsync-lab/rsyncd.pid
log file = /home/user/rsync-lab/rsyncd.log
port = 8873
address = 127.0.0.1
use chroot = false

[demo]
    path = /home/user/rsync-lab/served
    comment = Demo module for the guide lab
    read only = yes
    list = yes
    uid = root
    gid = root
